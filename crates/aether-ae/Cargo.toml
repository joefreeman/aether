[package]
name = "aether-ae"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aether editor — unified `ae` binary (server + terminal client, optional GUI)."

[[bin]]
name = "ae"
path = "src/main.rs"

[features]
# The daily workstation build ships the GUI. Headless builds (e.g. a server on a box with no
# display libraries) pass `--no-default-features` so `iced`/`winit`/`wgpu` never enter the graph.
default = ["gui"]
gui = ["dep:aether-iced"]

[dependencies]
aether-server = { workspace = true }
# Already in the graph via the shells; a direct dep so `ae server status` can render the app-info
# snapshot with the same formatters the in-app dialog uses instead of its own copy.
aether-client = { workspace = true }
aether-tui = { workspace = true }
aether-iced = { workspace = true, optional = true }

tokio = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
anyhow.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# `ae --web`'s tether waiter is a tiny headless client: it opens the buffer over the same
# RPC transport the native shells use and waits for the `buffer/closed` push.
aether-connection = { workspace = true }
aether-protocol = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `setsid` for detaching the auto-started server from the controlling terminal.
libc = "0.2"
