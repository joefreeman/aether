[package]
name = "aether-iced"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aether editor — iced (native GUI) client."

[dependencies]
aether-client = { workspace = true }
aether-connection = { workspace = true }
aether-protocol = { workspace = true }
serde = { workspace = true }
iced = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
unicode-width = { workspace = true }
ureq = { workspace = true }

# The `application:openURLs:` delegate — see src/mac_open.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }

[dev-dependencies]
iced_test = { workspace = true }
# Reading a headless frame back as pixels. Every rail, band and cursor block this shell draws is a
# fill, and a fill is invisible to `Operation::text` — the only thing the widget tree reports — so
# without a decoder there is no assertion that can see one at all.
png = "0.18"
tempfile = "3"
